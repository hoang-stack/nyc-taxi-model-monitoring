name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install
        run: pip install -e ".[dev]"
      - name: Lint
        run: |
          ruff check src tests
          ruff format --check src tests
      - name: Test
        run: pytest -q

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Demo model (synthetic trips)
        run: pip install -e . && python -m taximon.synthetic
      - name: Build and smoke-test the image
        run: |
          docker build -t taximon .
          docker run -d --name api -p 8000:8000 -v "$PWD/models:/app/models:ro" taximon
          for i in $(seq 1 30); do curl -fs localhost:8000/health && break; sleep 1; done
          curl -fs -X POST localhost:8000/predict -H 'content-type: application/json' \
            -d '{"pickup_datetime": "2020-04-01T08:30", "pu_location_id": 132,
                 "do_location_id": 230, "trip_distance": 17.2}'
          curl -fs localhost:8000/metrics | grep taximon_predictions_total
